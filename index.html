<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Brain</title>
<style>
  :root{
    --bg:#f6f5f2; --surface:#ffffff; --text:#1c1b19; --muted:#6b6a65; --line:#e5e3dd;
    --accent:#4f46e5; --accent-text:#ffffff; --danger:#c0392b;
    --radius:18px; --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#111113; --surface:#1b1b1f; --text:#ecebe8; --muted:#9a9890; --line:#2b2b31;
      --accent:#8b8cf8; --accent-text:#111113; --danger:#ff7b6b; --shadow:none;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:32px 20px 80px}
  button,input,select,textarea{font:inherit; color:inherit}
  a{color:var(--accent)}

  /* Header */
  .hero{display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; justify-content:space-between; margin-bottom:28px}
  .hero h1{margin:0; font-size:clamp(1.7rem,4vw,2.4rem); letter-spacing:-.02em; line-height:1.15}
  .hero p{margin:6px 0 0; color:var(--muted)}
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
  .search{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; min-width:220px; outline:none;
  }
  .search:focus{border-color:var(--accent)}
  .btn{
    border:1px solid var(--line); background:var(--surface); border-radius:12px;
    padding:10px 16px; cursor:pointer; font-weight:550; transition:transform .08s, border-color .15s;
  }
  .btn:hover{border-color:var(--accent)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent); color:var(--accent-text); border-color:var(--accent)}
  .btn.danger{color:var(--danger)}
  .btn.small{padding:6px 10px; font-size:.88rem; border-radius:10px}

  /* Sections & Grid */
  .section-title{
    font-size:.78rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted);
    margin:34px 0 12px; font-weight:650;
  }
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px}
  .tile{
    --c:hsl(var(--h) 70% 52%);
    position:relative; text-align:left; cursor:pointer;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;
    min-height:170px; transition:transform .15s, border-color .15s;
  }
  .tile:hover{transform:translateY(-3px); border-color:var(--c)}
  .tile:focus-visible,.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .icon{
    width:48px; height:48px; border-radius:14px; display:grid; place-items:center; font-size:1.55rem;
    background:color-mix(in srgb, var(--c) 16%, var(--surface));
  }
  .tile h3{margin:0; font-size:1.1rem; letter-spacing:-.01em}
  .tile p{margin:0; color:var(--muted); font-size:.92rem; flex:1}
  .meta{display:flex; justify-content:space-between; align-items:center; font-size:.8rem; color:var(--muted)}
  .badge{
    padding:2px 9px; border-radius:99px; font-weight:600;
    background:color-mix(in srgb, var(--c) 15%, var(--surface)); color:var(--text);
  }
  .tile.add{
    border-style:dashed; box-shadow:none; align-items:center; justify-content:center;
    color:var(--muted); background:transparent; min-height:170px;
  }
  .tile.add:hover{color:var(--accent); border-color:var(--accent)}
  .tile.add .plus{font-size:2rem; line-height:1}

  /* Detail */
  .back{background:none; border:0; cursor:pointer; color:var(--muted); padding:0; margin-bottom:18px; font-weight:550}
  .back:hover{color:var(--accent)}
  .detail-head{
    --c:hsl(var(--h) 70% 52%);
    display:flex; flex-wrap:wrap; gap:18px; align-items:center; justify-content:space-between; margin-bottom:24px;
  }
  .detail-head .left{display:flex; gap:16px; align-items:center}
  .detail-head h2{margin:0; font-size:clamp(1.5rem,3.5vw,2rem); letter-spacing:-.02em; line-height:1.15}
  .detail-head p{margin:4px 0 0; color:var(--muted)}
  .actions{display:flex; gap:8px; flex-wrap:wrap}
  .entries{display:grid; gap:12px}
  .entry{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px;
  }
  .entry-top{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
  .entry h4{margin:0 0 4px; font-size:1.02rem}
  .entry .text{white-space:pre-wrap; margin:6px 0 0}
  .entry .foot{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:10px; font-size:.82rem; color:var(--muted)}
  .tag{padding:1px 9px; border-radius:99px; border:1px solid var(--line)}
  .empty{
    text-align:center; padding:48px 20px; color:var(--muted);
    border:1px dashed var(--line); border-radius:var(--radius);
  }

  /* Dialog */
  dialog{
    border:1px solid var(--line); border-radius:20px; padding:0; width:min(520px,calc(100vw - 32px));
    background:var(--surface); color:var(--text); box-shadow:0 30px 80px rgba(0,0,0,.35);
  }
  dialog::backdrop{background:rgba(10,10,14,.5); backdrop-filter:blur(3px)}
  dialog form{padding:24px; display:grid; gap:14px}
  dialog h3{margin:0 0 4px; font-size:1.25rem}
  label{display:grid; gap:5px; font-size:.85rem; color:var(--muted); font-weight:550}
  input[type=text],input[type=url],select,textarea{
    background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    color:var(--text); outline:none; width:100%;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  textarea{min-height:120px; resize:vertical}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .dlg-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:4px}

  footer{margin-top:60px; padding-top:20px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px; align-items:center; color:var(--muted); font-size:.85rem}
  footer .spacer{flex:1}
  .hidden{display:none !important}
  @media (max-width:520px){ .row{grid-template-columns:1fr} .search{min-width:0; flex:1} }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>

  <footer>
    <span>Deine Daten liegen lokal in diesem Browser.</span>
    <span class="spacer"></span>
    <button class="btn small" id="exportBtn">Export (JSON)</button>
    <button class="btn small" id="importBtn">Import</button>
    <button class="btn small danger" id="resetBtn">Zurücksetzen</button>
    <input type="file" id="importFile" accept="application/json" class="hidden">
  </footer>
</div>

<!-- Dialog: Bestätigung (ersetzt confirm/alert, die in Vorschau-Fenstern blockiert sind) -->
<dialog id="confirmDlg">
  <form method="dialog" onsubmit="return false">
    <h3 id="confirmTitle">Bist du sicher?</h3>
    <p id="confirmMsg" style="margin:0"></p>
    <div class="dlg-actions">
      <button type="button" class="btn" id="confirmNo">Abbrechen</button>
      <button type="button" class="btn primary" id="confirmYes">OK</button>
    </div>
  </form>
</dialog>

<!-- Dialog: Eintrag verschieben -->
<dialog id="moveDlg">
  <form method="dialog" onsubmit="return false">
    <h3>Eintrag verschieben</h3>
    <p id="moveInfo" style="margin:0"></p>
    <label>Ziel-Kachel
      <select id="moveTarget"></select>
    </label>
    <div class="dlg-actions">
      <button type="button" class="btn" data-close>Abbrechen</button>
      <button type="button" class="btn primary" id="moveYes">Verschieben</button>
    </div>
  </form>
</dialog>

<!-- Dialog: Kachel -->
<dialog id="tileDlg">
  <form id="tileForm" method="dialog">
    <h3 id="tileDlgTitle">Neue Kachel</h3>
    <div class="row">
      <label>Typ
        <select name="type">
          <option value="kategorie">Kategorie</option>
          <option value="mentor">Mentor</option>
        </select>
      </label>
      <label>Icon (Emoji)
        <input type="text" name="icon" maxlength="4" placeholder="📚" required>
      </label>
    </div>
    <label>Titel
      <input type="text" name="title" required placeholder="z. B. Vertrieb & Closing">
    </label>
    <label>Kurzbeschreibung
      <input type="text" name="desc" placeholder="Worum geht es hier?">
    </label>
    <label>Farbe
      <select name="hue">
        <option value="245">Indigo</option>
        <option value="200">Blau</option>
        <option value="165">Türkis</option>
        <option value="140">Grün</option>
        <option value="40">Orange</option>
        <option value="10">Rot</option>
        <option value="330">Pink</option>
        <option value="275">Violett</option>
      </select>
    </label>
    <div class="dlg-actions">
      <button type="button" class="btn" data-close>Abbrechen</button>
      <button type="button" class="btn primary" data-save>Speichern</button>
    </div>
  </form>
</dialog>

<!-- Dialog: Eintrag -->
<dialog id="entryDlg">
  <form id="entryForm" method="dialog">
    <h3 id="entryDlgTitle">Neuer Eintrag</h3>
    <label>Titel
      <input type="text" name="title" required placeholder="z. B. Kernidee aus Buch / Podcast">
    </label>
    <label>Notiz
      <textarea name="text" placeholder="Deine Gedanken, Zitate, Learnings …"></textarea>
    </label>
    <div class="row">
      <label>Link (optional)
        <input type="text" name="link" placeholder="https://… oder seite.html">
      </label>
      <label>Tag (optional)
        <input type="text" name="tag" placeholder="z. B. Buch, Video, Idee">
      </label>
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn" data-close>Abbrechen</button>
      <button type="button" class="btn primary" data-save>Speichern</button>
    </div>
  </form>
</dialog>

/*
  Layout: a single reading column (max 46rem) under a sticky mini-index of
  numbered pills; each concept opens with a hand-drawn SVG recreation of its

:root{
  --bg:#F4F5F7;
  --surface:#FFFFFF;
  --surface-2:#ECEEF2;
  --fg:#1B2238;
  --muted:#5B6478;
  --accent:#B9811E;
  --accent-2:#3F8079;
  --border:#DADEE6;
  --font-display:'Fraunces',"Iowan Old Style","Palatino Linotype",serif;
  --font-body:'Work Sans',-apple-system,"Segoe UI",sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10182B;
    --surface:#18223D;
    --surface-2:#1E294A;
    --fg:#ECE6D8;
    --muted:#9AA3BC;
    --accent:#E0AE55;

  }
}
:root[data-theme="dark"]{
  --bg:#10182B;
  --surface:#18223D;
  --surface-2:#1E294A;
  --fg:#ECE6D8;
  --muted:#9AA3BC;
  --accent:#E0AE55;
  --accent-2:#6FA8A0;
  --border:#2B3657;
  color-scheme: dark;
}

*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font-body);
  padding-inline:20px;
  padding-block:0 64px;
}
.wrap{max-width:46rem; margin-inline:auto;}
.wide{max-width:58rem;}

a{color:var(--accent);}

h1,h2,h3{
  font-family:var(--font-display);
  font-weight:700;
  text-wrap:balance;
  line-height:1.15;
  margin:0;
}

.mono{
  font-family:var(--font-mono);

  letter-spacing:.08em;
  font-size:.72rem;
  font-weight:600;
}

/* ---- header ---- */
header.hero{
  padding-block:52px 28px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
header.hero .eyebrow{color:var(--accent);}
header.hero h1{font-size:clamp(1.9rem,5vw,2.6rem);}
header.hero p.lede{
  font-size:1.05rem;
  line-height:1.65;
  color:var(--muted);
  max-width:40rem;
}
.source-note{
  font-size:.85rem;
  color:var(--muted);
  border-left:3px solid var(--border);
  padding-left:12px;
  line-height:1.6;
}
.source-note b{color:var(--fg); font-weight:600;}

/* ---- sticky index ---- */
nav.toc{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:5;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding-block:10px;
  margin-bottom:12px;
}
nav.toc .row{
  max-width:46rem;

  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}
nav.toc .row::-webkit-scrollbar{display:none;}
nav.toc a{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:6px;
  text-decoration:none;
  color:var(--fg);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:999px;
  padding:6px 14px 6px 8px;
  font-family:var(--font-mono);
  font-size:.74rem;
}
nav.toc a span.n{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:18px; height:18px;
  border-radius:50%;
  background:var(--accent);
  color:var(--surface);
  font-size:.68rem;
  font-weight:700;
}

/* ---- concept sections ---- */
.concept{
  padding-block:44px;
  border-top:1px solid var(--border);
  display:flex;
  flex-direction:column;
  gap:18px;
  scroll-margin-top:60px;
}
.concept:first-of-type{border-top:none;}
.concept-head{display:flex; flex-direction:column; gap:6px;}
.concept-head .eyebrow{color:var(--accent);}
.concept-head h2{font-size:clamp(1.3rem,3.6vw,1.7rem);}

.prose p{line-height:1.7; margin:0 0 .9em;}
.prose p:last-child{margin-bottom:0;}
.prose b{color:var(--fg);}

.variant{
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:18px 18px 20px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
}
.variant-label{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-family:var(--font-mono);
  font-size:.72rem;
  color:var(--muted);
}
.variant-label .badge{
  width:20px;height:20px;
  border-radius:6px;
  background:var(--surface-2);
  border:1px solid var(--border);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:var(--accent);
  font-weight:700;
}

figure{margin:0;}
.diagram-frame{
  overflow-x:auto;
  border-radius:10px;
  background:var(--surface-2);
  padding:14px 10px;
}
.diagram-frame svg{display:block; height:auto;}
figcaption{
  margin-top:10px;
  font-size:.82rem;
  color:var(--muted);
  line-height:1.55;
}

.callout{
  border-radius:12px;
  padding:16px 18px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.callout .label{
  font-family:var(--font-mono);
  font-size:.7rem;

}
.callout p{margin:0; line-height:1.65; font-size:.96rem;}

      <figcaption>Zwei überlappende Kreise: links eine neue Personality, rechts ihre drei Bestandteile (Thoughts/Act/Feelings), die zusammen einen State of Being ergeben. Die Schnittmenge „NEW" ist der Kern der These.</figcaption>
    </figure>

    <div class="prose">
      <p><b>Kernformel:</b> Personality (= Thoughts + Act + Feelings) erzeugt einen State of Being → kombiniert mit einer neuen Personality ergibt das eine neue Personal Reality.</p>
      <p>Wer dauerhaft neu denkt, neu handelt und neu fühlt (= neue Personality), erzeugt dadurch einen neuen Seinszustand, der wiederum eine neue persönliche Realität hervorbringt. Das Beispielthema ist hier „Abundance", das Schema trägt aber für jede gewünschte neue Realität — Gesundheit, Erfolg, Beziehungen.</p>
    </div>

    <div class="callout kern">
      <span class="label">Einordnung</span>
      <p>Das ist der theoretische Überbau hinter Dispenzas Meditationspraxis: Die Visualisierungsübungen trainieren genau diese drei Elemente — Denken, Handeln, Fühlen „als ob" — bereits bevor die gewünschte Realität eintritt.</p>
    </div>
  </section>

    <div class="prose">
      <p>Ohne Eingreifen läuft die „Personal Reality of Lack" einfach geradeaus weiter in die Zukunft. Der Bogen zeigt den Sprung zu einer neu vorgestellten Realität — ermöglicht durch Intention (gibt die Richtung vor) und Energy (hält den Prozess am Laufen, „to keep doing").</p>
    </div>

    <div class="callout kern">
      <span class="label">Kernaussage</span>
      <p>Der Sprung gelingt nicht durch reines Nachdenken über die gewünschte Zukunft. Es braucht eine klare Richtung <i>und</i> die richtige Energie, um tatsächlich dranzubleiben — nicht nur einmalig zu visualisieren, sondern den Zustand aufrechtzuerhalten.</p>
    </div>
    <div class="callout bezug">
      <span class="label">Bezug zu Konzept 1</span>

  <!-- ============ KONZEPT 3 ============ -->

    </div>

            <tr><td>Unlearning</td><td>Relearning</td></tr>

            <tr><td>Stop doing the same things</td><td>Start doing new things</td></tr>
            <tr><td>Stop feeling the same way</td><td>Start feeling a different way</td></tr>
            <tr><td>Overcoming</td><td>Becoming</td></tr>

      <span class="label">Kernaussage</span>
      <p>Dieselbe Handlung aus zwei Blickwinkeln: nicht nur altes Denken, Handeln, Fühlen stoppen, sondern aktiv neues etablieren. Nicht nur „überwinden" — „werden".</p>
    </div>
    <div class="callout bezug">
      <span class="label">Bezug zu Konzept 1 &amp; 2</span>
      <p>„Start thinking/doing/feeling" entspricht direkt den drei Komponenten aus Konzept 1; „Becoming" ist das Ziel, zu dem der Bogen aus Konzept 2 hinführt.</p>

  </section>

      <span class="mono eyebrow">Eintrag 26 · LT Nurture</span>
      <h2>Frequenz und Qualität</h2>
    </div>
    <figure>

      <figcaption>Die Folie-Logik als Skizze: lieber eine Woche Pause und dann viermal mit gutem Inhalt als jede Woche halbherzig.</figcaption>
    </figure>
    <ul class="points">
      <li><b>1</b>Man kann nie zu oft mailen.</li>
      <li><b>2</b>Und auch keinen zu langen Content machen.</li>
      <li><b>3</b>Nur zu langweilig oder wertlos kann er sein.</li>
      <li><b>4</b>Besser eine Woche gar nicht mailen und in der nächsten Woche viermal mit gutem Inhalt, als jede Woche halbherzig.</li>
    </ul>
    <div class="callout kern">
      <span class="label">Kernaussage</span>
      <p>Der Maßstab ist Wert, nicht Menge. Frequenz und Länge sind kein Problem, solange der Inhalt nützlich ist. Qualität schlägt Regelmäßigkeit: Man darf pausieren, wenn gerade kein guter Inhalt da ist.</p>
    </div>
    <div class="callout bezug">
      <span class="label">Einordnung</span>
      <p>Das ist Hormozis Position, keine belegte Gewissheit. Besonders „nie zu oft“ ist eine starke Behauptung, und die Folie nennt dafür keine Zahlen. Im deutschen B2B-Umfeld kommen rechtliche Grenzen dazu: Werbe-Mails brauchen eine Einwilligung (Double-Opt-in), und eine hohe Frequenz erhöht das Risiko von Abmeldungen und Spam-Markierungen.</p>
    </div>
    <div class="callout use">
      <span class="label">Anwendung</span>
      <p>Testen statt glauben: zwei Frequenzen gegeneinander laufen lassen (wöchentlich gegen mehrere Impulse in einer Woche mit anschließender Pause) und Öffnungen, Klicks, Abmeldungen und Terminbuchungen vergleichen. Gibt es einen starken Schmerzpunkt oder ein gutes Testimonial, lohnt ein Schwung an Mails, gibt es nichts Gutes, lieber pausieren. Tiefe Inhalte dürfen länger sein, wenn der Einstieg stimmt.</p>
    </div>
  </section>

    <div class="callout kern">
      <span class="label">Kernaussage</span>
      <p>Die Folie verkauft nicht den Job, sondern die Entwicklung: Vertrieb reicht von der Einstiegsrolle bis in Strategie und Führung. SDR ist der Einstieg, Closer die nächste Stufe.</p>
    </div>
    <div class="callout bezug">
      <span class="label">Einordnung</span>
      <p><b>Zwei Stufen vor dem Abschluss:</b> SDR (vermutlich Setting und Terminierung) und Closer sind getrennte Rollen. Die Folie definiert SDR nicht, das ist eine Annahme. <b>Interne Beförderung als Pipeline:</b> Nachwuchs kommt aus dem eigenen Team, nicht nur von außen.</p>
    </div>
    <div class="callout use">
      <span class="label">Anwendung</span>
      <p>Einen sichtbaren Entwicklungspfad aufschreiben, mit den Stufen und den Kriterien für den Aufstieg. Das ist ein starkes Argument beim Recruiting und bei der Bindung. Prüfen, ob eine Trennung von Terminierung und Abschluss entlasten würde, besonders wenn die Funnel-Zahlen zeigen, dass die Engstelle vor dem Call liegt. Das hängt von Volumen und Teamgröße ab.</p>
    </div>
  </section>

  <section class="concept" id="k3">
    <div class="concept-head">
      <span class="mono eyebrow">Eintrag 28 · Getting More Salespeople</span>
      <h2>Das Angebot und die Erwartungen</h2>
    </div>
    <p class="source-note">Die Folie nennt nur Stichpunkte ohne Erklärung. Die rechte Spalte ist mein Verständnis und keine Aussage der Folie. <span class="tag-guess">Deutung</span></p>
    <div class="table-frame">
      <table>
        <thead><tr><th>#</th><th>Punkt auf der Folie</th><th>Verständnis</th></tr></thead>
        <tbody>
          <tr><td>1</td><td>Setting proper expectations</td><td>Der Fortschritt flacht mit der Zeit ab, aber die Fähigkeiten steigen weiter. Bewerber sollen das vorher wissen, damit sie nach dem schnellen Anfangserfolg nicht enttäuscht sind.</td></tr>
          <tr><td>2</td><td>Alternate title &amp; comp</td><td>Je nach Stufe oder Typ andere Titel und Vergütungsmodelle. Genaueres steht nicht auf der Folie.</td></tr>
          <tr><td>3</td><td>Cumulative closes</td><td>Abschlüsse zählen kumulativ, vermutlich ist der Aufstieg an die Gesamtzahl gekoppelt (Annahme).</td></tr>
          <tr><td>4</td><td>Don’t obsess about sale comp</td><td>Nicht auf die Provision fixieren, und doch ist sie laut Folie der stärkste Hebel. Vermutlich: gezielt gestalten, aber nicht überkomplex machen. Das bleibt unklar.</td></tr>
          <tr><td>5</td><td>How to figure it out</td><td>Rückwärts rechnen, wie viele Vollzeitkräfte (FTE) man für ein Ziel braucht, vom Skill-Level bis zu den nötigen Aktionen wie Calls und Terminen.</td></tr>
          <tr><td>6</td><td>Give best leads to the best closers (again)</td><td>Die besten Leads gehen an die besten Closer. „Again“ deutet darauf hin, dass es schon an anderer Stelle vorkam.</td></tr>
        </tbody>
      </table>
    </div>
    <div class="callout bezug">
      <span class="label">Einordnung</span>
      <p>Punkt 5 ist Kapazitätsplanung aus dem Funnel heraus: Erst wenn man die nötigen Abschlüsse kennt, lässt sich der Personalbedarf ableiten. Punkt 6 widerspricht einer gleichmäßigen Lead-Verteilung, er priorisiert den Ertrag. Der Preis: Schwächere Closer bekommen weniger gute Leads und entwickeln sich schwerer, ein Zielkonflikt mit dem Trainingsgedanken.</p>
    </div>
    <div class="callout use">
      <span class="label">Anwendung</span>
      <p>Den Personalbedarf von hinten rechnen: gewünschte Abschlüsse pro Monat, dann Show-Rate und Abschlussquote, dann Kapazität pro Closer. Vor einer Regel zur Lead-Verteilung testen, ob stärkere Leads bei stärkeren Leuten tatsächlich mehr Umsatz bringen. Zu Höhe und Modell der Vergütung sagt die Folie nichts, das muss intern geklärt werden.</p>
    </div>
  </section>

      }
      mind.entries.push({ id:"shaolin-online", title:"Shaolin Online (Kurs)",
        text:"Die Inhalte aus den Kurs-Screenshots werden hier ergänzt.", link:"", tag:"Kurs",
        mentor:mentor.id, created:Date.now() });
    }
    s.addonsApplied.push("shi-heng-yi");
  }
  return s;
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && Array.isArray(s.tiles)){ const r = applyAddons(s); localStorage.setItem(KEY, JSON.stringify(r)); return r; }
    }
  }catch(e){}
  return applyAddons(structuredClone(SEED));
}
let state = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ askConfirm("Speichern im Browser nicht möglich. Nutze bitte den Export-Button als Backup.", { info:true, title:"Hinweis" }); }
}
function askConfirm(msg, opts = {}){
  const { yes = "OK", title = "Bist du sicher?", info = false } = opts;
  return new Promise(resolve => {
    const d = document.getElementById("confirmDlg"), y = document.getElementById("confirmYes"), n = document.getElementById("confirmNo");
    document.getElementById("confirmMsg").textContent = msg;
    document.getElementById("confirmTitle").textContent = title;
    y.textContent = yes; n.classList.toggle("hidden", info);
    const done = v => { y.onclick = n.onclick = d.onclose = null; if(d.open) d.close(); resolve(v); };
    y.onclick = () => done(true); n.onclick = () => done(false); d.onclose = () => done(false);
    d.showModal();
  });
}
const uid = () => Math.random().toString(36).slice(2,10);

/* ---------- DOM-Helfer (sicher: nutzt textContent, kein innerHTML) ---------- */
function h(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k === "class") e.className = v;
    else if(k === "style") e.style.cssText = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(k => {
    if(k === null || k === undefined || k === false) return;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  });
  return e;
}
/* Erlaubt: http(s)-Links, eingebettete Seiten ("page:name") und relative Links auf eigene .html-Dateien */
const safeUrl = u => {
  if(/^page:[\w-]+$/.test(u)) return "#/page/" + u.slice(5);
  if(/^[\w\-./]+\.html?(#[\w\-/]*)?$/i.test(u) && !u.startsWith("/") && !u.includes("..")) return u;
  try{ const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; }catch(e){ return null; }
};
const app = document.getElementById("app");
let query = "";

/* Einträge, die eine Kachel anzeigt: die eigenen plus Einträge aus anderen Kacheln, die mit
   entry.mentor auf diese Kachel verweisen (z. B. ein Kurs in "Mindset", der zu "Joe Dispenza" gehört). */
function entriesOf(t){
  const own = (t.entries || []).map(e => ({ e, owner:t, via:null }));
  const ref = state.tiles.filter(x => x !== t)
    .flatMap(x => (x.entries || []).filter(e => e.mentor === t.id).map(e => ({ e, owner:x, via:x })));
  return own.concat(ref);
}
let lastTile = null;

/* ---------- Routing ---------- */
function route(){
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  if(id.startsWith("page/")){ renderPage(id.slice(5)); window.scrollTo(0,0); return; }
  const tile = state.tiles.find(t => t.id === id);
  if(tile){ lastTile = tile.id; renderTile(tile); } else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* ---------- Eingebettete Seiten (Kursseiten) ----------
   Jede Seite liegt unten als <script type="text/html" id="page-NAME"> im Dashboard.
   Verlinkt wird sie in einem Eintrag mit dem Link "page:NAME". */
function renderPage(name){
  const src = document.getElementById("page-" + name);
  const owner = state.tiles.find(t => t.entries.some(e => e.link === "page:" + name));
  const back = h("button", { class:"back", onclick:() => { const back = (lastTile && state.tiles.some(t => t.id === lastTile)) ? lastTile : (owner ? owner.id : null); location.hash = back ? "#/" + encodeURIComponent(back) : ""; } }, "← Zurück");
  if(!src){ app.replaceChildren(back, h("div", { class:"empty" }, "Diese Seite ist nicht im Dashboard hinterlegt.")); return; }
  const frame = h("iframe", { sandbox:"allow-same-origin", title:name,
    style:"width:100%;height:calc(100vh - 150px);min-height:520px;border:1px solid var(--line);border-radius:14px;background:var(--surface)" });
  frame.addEventListener("load", () => {
    try{
      const d = frame.contentDocument;
      d.addEventListener("click", ev => {
        const a = ev.target.closest && ev.target.closest('a[href^="#"]');
        if(!a) return;
        ev.preventDefault();
        const el = d.getElementById(decodeURIComponent(a.getAttribute("href").slice(1)));
        if(el) el.scrollIntoView({ behavior:"smooth" });
      });
    }catch(e){}
  });
  frame.srcdoc = src.textContent;
  app.replaceChildren(back, frame);
}

/* ---------- Startseite ---------- */
function greeting(){
  const hr = new Date().getHours();
  return hr < 11 ? "Guten Morgen" : hr < 18 ? "Guten Tag" : "Guten Abend";
}
function matches(t){
  if(!query) return true;
  const q = query.toLowerCase();
  return [t.title, t.desc, ...entriesOf(t).map(x => x.e).flatMap(e => [e.title, e.text, e.tag])]
    .some(s => (s || "").toLowerCase().includes(q));
}
function tileCard(t){
  const n = entriesOf(t).length;
  return h("button", { class:"tile", style:`--h:${t.hue}`, onclick:() => location.hash = "#/" + encodeURIComponent(t.id) },
    h("div", { class:"icon" }, t.icon || "📁"),
    h("h3", {}, t.title),
    h("p", {}, t.desc || ""),
    h("div", { class:"meta" },
      h("span", { class:"badge" }, t.type === "mentor" ? "Mentor" : "Kategorie"),
      h("span", {}, n === 1 ? "1 Eintrag" : `${n} Einträge`)
    )
  );
}
function renderHome(){
  const total = state.tiles.reduce((s,t) => s + t.entries.length, 0);
  const search = h("input", { class:"search", type:"search", placeholder:"Alles durchsuchen …", value:query });
  search.addEventListener("input", () => { query = search.value; renderSections(); });

  const sections = h("div", { id:"sections" });
  app.replaceChildren(
    h("div", { class:"hero" },
      h("div", {},
        h("h1", {}, `${greeting()} 👋`),
        h("p", {}, `${state.tiles.length} Kacheln · ${total} Einträge in deinem Second Brain`)
      ),
      h("div", { class:"toolbar" }, search,
        h("button", { class:"btn primary", onclick:() => openTileDlg() }, "+ Neue Kachel"))
    ),
    sections
  );
  renderSections();
  if(query) search.focus();
}
function renderSections(){
  const box = document.getElementById("sections");
  const build = (type, label) => {
    const list = state.tiles.filter(t => t.type === type && matches(t));
    if(!list.length && query) return null;
    const grid = h("div", { class:"grid" }, list.map(tileCard));
    if(!query){
      grid.append(h("button", { class:"tile add", onclick:() => openTileDlg(null, type) },
        h("span", { class:"plus" }, "+"),
        h("span", {}, type === "mentor" ? "Mentor hinzufügen" : "Kategorie hinzufügen")));
    }
    return h("section", {}, h("div", { class:"section-title" }, label), grid);
  };
  const parts = [build("kategorie","Kategorien"), build("mentor","Mentoren")].filter(Boolean);
  box.replaceChildren(...(parts.length ? parts : [h("div", { class:"empty" }, "Nichts gefunden.")]));
}

/* ---------- Detailansicht ---------- */
function renderTile(t){
  const entries = entriesOf(t).sort((a,b) => b.e.created - a.e.created);
  app.replaceChildren(
    h("button", { class:"back", onclick:() => location.hash = "" }, "← Zurück zur Übersicht"),
    h("div", { class:"detail-head", style:`--h:${t.hue}` },
      h("div", { class:"left" },
        h("div", { class:"icon", style:`--c:hsl(${t.hue} 70% 52%)` }, t.icon || "📁"),
        h("div", {}, h("h2", {}, t.title), h("p", {}, t.desc || ""))
      ),
      h("div", { class:"actions" },
        h("button", { class:"btn primary", onclick:() => openEntryDlg(t) }, "+ Eintrag"),
        h("button", { class:"btn", onclick:() => openTileDlg(t) }, "Bearbeiten"),
        h("button", { class:"btn danger", onclick:async () => {
          if(await askConfirm(`„${t.title}“ inkl. aller ${t.entries.length} Einträge löschen?`, { yes:"Löschen" })){
            state.tiles = state.tiles.filter(x => x.id !== t.id); save(); location.hash = "";
          }
        } }, "Löschen")
      )
    ),
    entries.length
      ? h("div", { class:"entries" }, entries.map(x => entryCard(x.owner, x.e, x.via)))
      : h("div", { class:"empty" }, "Noch keine Einträge. Lege mit „+ Eintrag“ den ersten an.")
  );
}
function entryCard(t, e, via = null){
  const url = e.link && safeUrl(e.link);
  return h("article", { class:"entry" },
    h("div", { class:"entry-top" },
      h("div", {}, h("h4", {}, e.title), e.text ? h("div", { class:"text" }, e.text) : null),
      h("div", { class:"actions" },
        h("button", { class:"btn small", onclick:() => openEntryDlg(t, e) }, "Bearbeiten"),
        state.tiles.length > 1 ? h("button", { class:"btn small", onclick:() => openMoveDlg(t, e) }, "Verschieben") : null,
        h("button", { class:"btn small danger", onclick:async () => {
          if(await askConfirm("Eintrag löschen?", { yes:"Löschen" })){ t.entries = t.entries.filter(x => x.id !== e.id); save(); route(); }
        } }, "✕")
      )
    ),
    h("div", { class:"foot" },
      via ? h("span", { class:"tag" }, `liegt in: ${via.title}`) : null,
      e.tag ? h("span", { class:"tag" }, e.tag) : null,
      url ? (/^https?:/i.test(url)
        ? h("a", { href:url, target:"_blank", rel:"noopener noreferrer" }, "Link öffnen ↗")
        : h("a", url.startsWith("#/") ? { href:url, onclick:ev => { ev.preventDefault(); location.hash = url; } } : { href:url }, "Seite öffnen →")) : null,
      h("span", {}, new Date(e.created).toLocaleDateString("de-DE"))
    )
  );
}

/* ---------- Dialoge ---------- */
const tileDlg = document.getElementById("tileDlg"), tileForm = document.getElementById("tileForm");
const entryDlg = document.getElementById("entryDlg"), entryForm = document.getElementById("entryForm");
let editingTile = null, editingEntry = null, entryParent = null;

document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close()));
[tileDlg, entryDlg].forEach(d => d.addEventListener("click", ev => { if(ev.target === d) d.close(); }));

function openTileDlg(tile = null, presetType = "kategorie"){
  editingTile = tile;
  document.getElementById("tileDlgTitle").textContent = tile ? "Kachel bearbeiten" : "Neue Kachel";
  tileForm.type.value = tile ? tile.type : presetType;
  tileForm.icon.value = tile ? tile.icon : (presetType === "mentor" ? "🧠" : "📚");
  tileForm.title.value = tile ? tile.title : "";
  tileForm.desc.value = tile ? tile.desc : "";
  tileForm.hue.value = tile ? String(tile.hue) : "245";
  tileDlg.showModal();
}
function saveTile(){
  if(!tileForm.reportValidity()) return;
  const f = tileForm, data = { type:f.type.value, icon:f.icon.value.trim(), title:f.title.value.trim(), desc:f.desc.value.trim(), hue:Number(f.hue.value) };
  if(editingTile){ Object.assign(editingTile, data); }
  else { state.tiles.push({ id: uid(), entries:[], ...data }); }
  save(); tileDlg.close(); route();
}

function openEntryDlg(tile, entry = null){
  entryParent = tile; editingEntry = entry;
  document.getElementById("entryDlgTitle").textContent = entry ? "Eintrag bearbeiten" : "Neuer Eintrag";
  entryForm.title.value = entry ? entry.title : "";
  entryForm.text.value = entry ? entry.text : "";
  entryForm.link.value = entry ? entry.link : "";
  entryForm.tag.value = entry ? entry.tag : "";
  entryDlg.showModal();
}
function saveEntry(){
  if(!entryForm.reportValidity()) return;
  const f = entryForm, data = { title:f.title.value.trim(), text:f.text.value.trim(), link:f.link.value.trim(), tag:f.tag.value.trim() };
  if(editingEntry){ Object.assign(editingEntry, data); }
  else { entryParent.entries.push({ id: uid(), created: Date.now(), ...data }); }
  save(); entryDlg.close(); route();
}

/* Speichern per Button oder Enter – ohne echtes Formular-Submit (in Vorschau-Fenstern blockiert) */
[[tileForm, saveTile], [entryForm, saveEntry]].forEach(([form, fn]) => {
  form.querySelector("[data-save]").addEventListener("click", fn);
  form.addEventListener("submit", ev => ev.preventDefault());
  form.addEventListener("keydown", ev => {
    if(ev.key === "Enter" && ev.target.tagName !== "TEXTAREA" && ev.target.tagName !== "BUTTON"){ ev.preventDefault(); fn(); }
  });
});

/* ---------- Eintrag in andere Kachel verschieben ---------- */
const moveDlg = document.getElementById("moveDlg");
let moveCtx = null;
function openMoveDlg(t, e){
  moveCtx = { t, e };
  document.getElementById("moveInfo").textContent = `„${e.title}“ verschieben nach:`;
  document.getElementById("moveTarget").replaceChildren(
    ...state.tiles.filter(x => x.id !== t.id).map(x => h("option", { value:x.id }, `${x.icon || ""} ${x.title}`)));
  moveDlg.showModal();
}
document.getElementById("moveYes").addEventListener("click", () => {
  const { t, e } = moveCtx || {};
  const target = state.tiles.find(x => x.id === document.getElementById("moveTarget").value);
  if(!t || !target) return;
  t.entries = t.entries.filter(x => x.id !== e.id);
  if(t.type === "mentor" && !e.mentor) e.mentor = t.id;   /* bleibt beim Mentor mitgezählt */
  if(e.mentor === target.id) delete e.mentor;              /* zurück zum Mentor: kein Verweis nötig */
  target.entries.push(e);
  save(); moveDlg.close(); location.hash = "#/" + encodeURIComponent(target.id);
});
moveDlg.addEventListener("click", ev => { if(ev.target === moveDlg) moveDlg.close(); });

/* ---------- Export / Import / Reset ---------- */
document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
  const a = h("a", { href:URL.createObjectURL(blob), download:`second-brain-${new Date().toISOString().slice(0,10)}.json` });
  document.body.append(a); a.click(); a.remove();
});
document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", async ev => {
  const file = ev.target.files[0]; if(!file) return;
  try{
    const s = JSON.parse(await file.text());
    if(!s || !Array.isArray(s.tiles)) throw new Error();
    if(await askConfirm("Aktuelle Daten durch den Import ersetzen?", { yes:"Ersetzen" })){ state = s; save(); location.hash = ""; route(); }
  }catch(e){ askConfirm("Die Datei ist kein gültiger Second-Brain-Export.", { info:true, title:"Import fehlgeschlagen" }); }
  ev.target.value = "";
});
document.getElementById("resetBtn").addEventListener("click", async () => {
  if(await askConfirm("Alle Daten verwerfen und die Startdaten neu laden?", { yes:"Zurücksetzen" })){ state = structuredClone(SEED); save(); location.hash = ""; route(); }
});

route();
</script>
</body>
